name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ffi_ci
          POSTGRES_USER: ffi_ci
          POSTGRES_PASSWORD: ffi_ci
        options: >-
          --health-cmd "pg_isready -U ffi_ci -d ffi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-dev-secret-key"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "ffi_ci"
      DB_USER: "ffi_ci"
      DB_PASSWORD: "ffi_ci"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Keep CI on the same Python minor version as Backend/Dockerfile.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          REQ_FILE="$(find . -maxdepth 4 -type f -iname 'requirements.txt' | grep -Ei '/backend/' | head -n1)"
          if [ -z "$REQ_FILE" ]; then
            echo "Backend requirements.txt not found. Repository tree (top level):"
            ls -la
            exit 1
          fi
          echo "Using requirements file: $REQ_FILE"
          pip install -r "$REQ_FILE"
          pip install ruff bandit pip-audit

      - name: Validate Pinned Backend Dependencies
        run: |
          python - <<'PY'
          from pathlib import Path

          requirements = Path("Backend/requirements.txt")
          unpinned = [
              line
              for line in requirements.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#") and "==" not in line
          ]
          if unpinned:
              raise SystemExit("Direct dependencies must use exact pins: " + ", ".join(unpinned))
          PY
          python -m pip check

      - name: Ruff Lint
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- Backend | grep -E '^Backend/.*\.py$' | grep -v '^Backend/static/pdf_templates/' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No maintained backend Python files changed."
            exit 0
          fi
          cd Backend
          ruff check "${files[@]/#Backend\//}"

      - name: Ruff Format Check
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- Backend | grep -E '^Backend/.*\.py$' | grep -v '^Backend/static/pdf_templates/' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No maintained backend Python files changed."
            exit 0
          fi
          cd Backend
          ruff format --check "${files[@]/#Backend\//}"

      - name: Backend Tests
        run: |
          cd Backend
          pytest -q

      - name: Bandit Security Scan
        run: |
          cd Backend
          # Fail the release gate on high-severity production findings. Test
          # fixtures and one-off local verification scripts are not shipped.
          bandit -r . -lll -x "*/migrations/*,*/tests/*,*/venv/*,*/.venv/*,run_debug_tests.py,verify_endpoint.py,verify_manager_workflow.py"

      - name: Python Dependency Audit
        run: |
          REQ_FILE="$(find . -maxdepth 4 -type f -iname 'requirements.txt' | grep -Ei '/backend/' | head -n1)"
          if [ -z "$REQ_FILE" ]; then
            echo "Backend requirements.txt not found for pip-audit"
            exit 1
          fi
          pip-audit -r "$REQ_FILE"

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Install Dependencies
        run: |
          cd FrontEnd
          npm ci

      - name: Lint
        run: |
          cd FrontEnd
          npm run lint

      - name: Type Check
        run: |
          cd FrontEnd
          npm run type-check

      - name: Frontend Tests
        run: |
          cd FrontEnd
          npm run test -- --run

      - name: Build
        run: |
          cd FrontEnd
          npm run build

      - name: NPM Audit
        run: |
          cd FrontEnd
          npm audit --audit-level=high
