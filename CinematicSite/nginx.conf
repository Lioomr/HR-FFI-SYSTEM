server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types application/json application/javascript application/xml text/css text/plain text/xml image/svg+xml;

    # Vite emits content-hashed filenames under /assets/, so these are safe to
    # cache forever — a rebuild changes the filename, not the content at this URL.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }

    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
