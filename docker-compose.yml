services:
  db:
    image: postgres:16-alpine
    container_name: ffi_hr_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ffi_hr_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ffi_hr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    container_name: ffi_hr_backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env.docker
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ffi_hr_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./FrontEnd
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: ffi_hr_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  evolution-db:
    image: postgres:16-alpine
    container_name: ffi_hr_evolution_db
    restart: unless-stopped
    profiles: ["messaging-trial"]
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    container_name: ffi_hr_evolution_redis
    restart: unless-stopped
    profiles: ["messaging-trial"]
    volumes:
      - evolution_redis_data:/data

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: ffi_hr_evolution_api
    restart: unless-stopped
    profiles: ["messaging-trial"]
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me}
      DEL_INSTANCE_ON_DISCONNECT: "false"
      QRCODE_LIMIT: "30"
      CONFIG_SESSION_PHONE_CLIENT: Evolution API
      CONFIG_SESSION_PHONE_NAME: Chrome
      CONFIG_SESSION_PHONE_VERSION: 2.3000.1041554264
      WEB_VERSION: 2.3000.1041554264
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-db:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      SERVER_URL: http://localhost:8080
    volumes:
      - evolution_store:/evolution/store
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_store:
  evolution_instances:
