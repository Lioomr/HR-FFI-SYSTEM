# Local development stack, shared by every session on this machine.
#
# Container names and host ports default to the shared stack (ffi_hr_*,
# 5173/8000/5432). A git worktree that needs its own stack must use a separate
# project, prefix and ports so it never replaces the shared containers:
#
#   FFI_CONTAINER_PREFIX=ffi_wt1 FFI_FRONTEND_PORT=5273 FFI_BACKEND_PORT=8100
#   FFI_DB_PORT=5532 EVOLUTION_API_PORT=8180
#   docker compose -p hr-ffi-wt1 -f docker-compose.dev.yml up -d --build
#
# (set those variables in the environment first; the ports above are examples)
#
# Prefer tools/dev-compose.sh (or .ps1): it stamps images with the git commit
# and refuses to rebuild the shared stack from a worktree. See AGENTS.md.
services:
  db:
    image: postgres:16-alpine
    container_name: ${FFI_CONTAINER_PREFIX:-ffi_hr}_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ffi_hr_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${FFI_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ffi_hr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${FFI_CONTAINER_PREFIX:-ffi_hr}_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      labels:
        com.ffi.build.commit: "${FFI_BUILD_COMMIT:-unknown}"
        com.ffi.build.dirty: "${FFI_BUILD_DIRTY:-unknown}"
        com.ffi.build.source: "${FFI_BUILD_SOURCE:-unknown}"
        com.ffi.build.time: "${FFI_BUILD_TIME:-unknown}"
    container_name: ${FFI_CONTAINER_PREFIX:-ffi_hr}_backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env.docker
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ffi_hr_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:${FFI_FRONTEND_PORT:-5173}
      CSRF_TRUSTED_ORIGINS: http://localhost:${FFI_FRONTEND_PORT:-5173}
      FRONTEND_URL: http://localhost:${FFI_FRONTEND_PORT:-5173}
      HR_TEMPLATES_DIR: /hr/templates
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${FFI_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./Backend/static/pdf_templates:/hr/templates:ro
      - private_uploads:/app/private_uploads
    healthcheck:
      # /healthz/ only returns dependency status to callers that present the probe
      # token, so pass it here to keep this an actual readiness check.
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'X-Health-Token': os.environ.get('HEALTH_CHECK_TOKEN', '')}), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  notification-worker:
    build:
      context: ./Backend
      labels:
        com.ffi.build.commit: "${FFI_BUILD_COMMIT:-unknown}"
        com.ffi.build.dirty: "${FFI_BUILD_DIRTY:-unknown}"
        com.ffi.build.source: "${FFI_BUILD_SOURCE:-unknown}"
        com.ffi.build.time: "${FFI_BUILD_TIME:-unknown}"
    container_name: ${FFI_CONTAINER_PREFIX:-ffi_hr}_notification_worker
    restart: unless-stopped
    user: "app"
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    env_file:
      - ./Backend/.env.docker
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ffi_hr_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      EVOLUTION_API_BASE_URL: http://evolution-api:${EVOLUTION_API_PORT:-8080}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
        required: false
    volumes:
      - ./Backend/static/pdf_templates:/hr/templates:ro
      - private_uploads:/app/private_uploads
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery-beat:
    build:
      context: ./Backend
      labels:
        com.ffi.build.commit: "${FFI_BUILD_COMMIT:-unknown}"
        com.ffi.build.dirty: "${FFI_BUILD_DIRTY:-unknown}"
        com.ffi.build.source: "${FFI_BUILD_SOURCE:-unknown}"
        com.ffi.build.time: "${FFI_BUILD_TIME:-unknown}"
    container_name: ${FFI_CONTAINER_PREFIX:-ffi_hr}_celery_beat
    restart: unless-stopped
    user: "app"
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    env_file:
      - ./Backend/.env.docker
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ffi_hr_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      EVOLUTION_API_BASE_URL: http://evolution-api:${EVOLUTION_API_PORT:-8080}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./Backend/static/pdf_templates:/hr/templates:ro
      - private_uploads:/app/private_uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import glob,sys; sys.exit(0 if any(b'celery' in open(p+'/cmdline','rb').read() and b'beat' in open(p+'/cmdline','rb').read() for p in glob.glob('/proc/[0-9]*')) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./FrontEnd
      args:
        VITE_API_BASE_URL: ""
        FFI_BUILD_COMMIT: "${FFI_BUILD_COMMIT:-unknown}"
        FFI_BUILD_DIRTY: "${FFI_BUILD_DIRTY:-unknown}"
        FFI_BUILD_TIME: "${FFI_BUILD_TIME:-unknown}"
      labels:
        com.ffi.build.commit: "${FFI_BUILD_COMMIT:-unknown}"
        com.ffi.build.dirty: "${FFI_BUILD_DIRTY:-unknown}"
        com.ffi.build.source: "${FFI_BUILD_SOURCE:-unknown}"
        com.ffi.build.time: "${FFI_BUILD_TIME:-unknown}"
    container_name: ${FFI_CONTAINER_PREFIX:-ffi_hr}_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FFI_FRONTEND_PORT:-5173}:80"

  cinematic-site:
    build:
      context: ./CinematicSite
    container_name: ${FFI_CINEMATIC_CONTAINER:-ffi_cinematic_site}
    restart: unless-stopped
    profiles: ["marketing"]
    ports:
      - "${FFI_CINEMATIC_PORT:-5174}:80"

  evolution-db:
    image: postgres:16-alpine
    container_name: ${FFI_CONTAINER_PREFIX:-ffi_hr}_evolution_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    container_name: ${FFI_CONTAINER_PREFIX:-ffi_hr}_evolution_redis
    restart: unless-stopped
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: ${FFI_CONTAINER_PREFIX:-ffi_hr}_evolution_api
    restart: unless-stopped
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me}
      DEL_INSTANCE_ON_DISCONNECT: "false"
      QRCODE_LIMIT: "30"
      CONFIG_SESSION_PHONE_CLIENT: Evolution API
      CONFIG_SESSION_PHONE_NAME: Chrome
      CONFIG_SESSION_PHONE_VERSION: 2.3000.1041554264
      WEB_VERSION: 2.3000.1041554264
      SERVER_PORT: ${EVOLUTION_API_PORT:-8080}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-db:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      SERVER_URL: http://localhost:${EVOLUTION_API_PORT:-8080}
    volumes:
      - evolution_store:/evolution/store
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    ports:
      - "${EVOLUTION_API_PORT:-8080}:${EVOLUTION_API_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$${SERVER_PORT:-8080}/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  private_uploads:
  redis_data:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_store:
  evolution_instances:
