server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The candidate-facing offer page is a client-side route that lives one
    # trailing slash away from the public API it calls (/job-offers/respond/).
    # An exact match keeps the page itself on the SPA while every other
    # /job-offers/ path falls through to the proxy below. Exact locations beat
    # the regex, so this must stay above it.
    location = /job-offers/respond {
        try_files /index.html =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # /hiring-requests/{id} is the compatibility route notifications link to,
    # and it collides with the API prefix below. Every API path under this
    # module ends in a slash (/hiring-requests/, /hiring-requests/1/cv/), so the
    # slashless numeric form is the SPA one. Regex locations match in order, so
    # this must stay above the proxy block.
    location ~ ^/hiring-requests/[0-9]+$ {
        try_files /index.html =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    gzip on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types application/json application/javascript application/xml text/css text/plain text/xml image/svg+xml;

    # Keep browser API traffic same-origin. Only explicit backend prefixes are
    # proxied so client-side routes such as /admin/dashboard remain SPA paths.
    location ~ ^/(api|auth|employees|imports|invites|users|settings|payroll-runs|audit-logs|job-offers|hiring-requests)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120;
    }

    location = /admin/summary/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120;
    }

    # Vite emits content-hashed filenames under /assets/, so these are safe to
    # cache forever — a rebuild changes the filename, not the content at this URL.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri /index.html;
        # The SPA shell must never be cached. nginx otherwise serves it with an
        # ETag and no Cache-Control, so browsers apply heuristic freshness and
        # reuse it without revalidating -- which strands users on an old bundle
        # after a deploy, and lets a cached fallback stand in for an API path
        # that the proxy above has since started handling.
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
