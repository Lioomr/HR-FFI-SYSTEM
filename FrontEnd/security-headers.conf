# Security headers for everything nginx serves itself (the SPA shell and its
# static assets). nginx drops inherited add_header directives as soon as a
# location declares its own (Cache-Control below), so each static location
# includes this file instead of relying on server-level inheritance.
#
# Proxied API locations deliberately do NOT include it: Django already sends
# X-Frame-Options and nosniff, and repeating them would duplicate the headers.
#
# The CSP was previously an index.html <meta> tag, where browsers ignore
# frame-ancestors. Keep style-src 'unsafe-inline': antd injects its CSS-in-JS
# styles at runtime. img-src api.maptiler.com serves the Leaflet map tiles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://api.maptiler.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# geolocation: work-location picker; camera: evidence photo capture.
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), bluetooth=(), serial=(), accelerometer=(), gyroscope=(), magnetometer=(), interest-cohort=()" always;
